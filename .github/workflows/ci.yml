name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest httpx
          pip install -e ".[mcp]" agents-memory agents-traces

      - name: Test
        run: |
          python -m runner.executor --validate
          python -m unittest discover tests

      - name: Build
        run: |
          python -m build
          twine check dist/*
