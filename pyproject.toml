[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-harness"
version = "0.1.0"
description = "Declarative scheduled flow runner, per-request agent loop, and job kernel for local agent services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "harness", "runner", "executor", "kernel", "mcp", "cordis", "loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/agents-harness"
Repository = "https://github.com/Lolaplex/agents-harness"
"Bug Tracker" = "https://github.com/Lolaplex/agents-harness/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2"]
traces = ["agents-traces>=0.1.0"]

[project.scripts]
agents-harness = "runner.executor:main"
agents-harness-loop = "runner.loop:main"
agents-harness-mcp = "runner.mcp_server:main"
agents-harness-kernel = "runner.kernel:main"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.setuptools.package-data]
"runner" = [
    "modules/*.json",
    "providers/*.json",
    "schedules/*.json",
    "schema/*.json",
    "terms/*.json",
]

