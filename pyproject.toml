[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-harness"
version = "0.1.0"
description = "Declarative scheduled flow runner and test harness for local agent services"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2"]

[project.scripts]
agents-harness = "runner.executor:main"
agents-harness-loop = "runner.loop:main"
agents-harness-mcp = "runner.mcp_server:main"
agents-harness-kernel = "runner.kernel:main"
